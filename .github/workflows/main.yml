name: Reading List on Issue open

on:
  issues:
    types: [opened, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.issue.user.login == 'jasonrclark'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4'

      - name: Issue to reading list
        run: |
          mkdir -p /tmp
          gh issue view ${{ github.event.issue.number }} --json body | \
            jq -r .body | \
            scripts/reading-list.rb

          git config --global user.email "jason@jasonrclark.net"
          git config --global user.name "Jason R. Clark"
          git status
          git diff
          git add reading.html _posts
          git commit -m "Reading

          Closes #${{ github.event.issue.number }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
